<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gray Market</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a; /* Sleek dark-mode background matching your images */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 30px 20px;
        }

        /* Brand Icon/Logo */
        .brand-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #06b6d4; /* Vibrant cyan border to match logo glow */
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* Brand Name */
        .brand-name {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Welcome Message */
        .welcome-msg {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        /* Main Telegram Button */
        .cta-button {
            display: block;
            background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%); /* Cyan/Blue gradient */
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 18px 25px;
            border-radius: 50px; /* Fully rounded elegant pill shape */
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Interaction Effects */
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
        }

        .cta-button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="brand-icon" src="logo.jpg" alt="The Gray Market Logo">
        
        <h1 class="brand-name">The Gray Market</h1>
        <div class="brand-subtitle">Medicine Pharma</div>
        
        <p class="welcome-msg">
            Welcome to the official portal. Connect directly with verified vendors, explore customer reviews, and secure your access seamlessly below.
        </p>
        
        <a href="https://t.me/+yTBDkWP6acRhN2Y0" class="cta-button" target="_blank">
            Enter The Gray Market
        </a>
    </div>

</body>
</html>
